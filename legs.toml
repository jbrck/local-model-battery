thinking_effect = "long reasoning traces push code out of the window on low caps"
prereqs = []
resume = "done_marker"
comparability_keys = ["cap", "ctx", "thinking", "seed", "items_sha"]
known_failures = ["items that reason past the cap emit no code block and score zero"]

