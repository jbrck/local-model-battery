# legs.toml — what the battery tests, and what each leg needs.
#
# One entry per benchmark leg. Item counts and budget floors live in standard.toml so
# there is one frozen number per leg; the loader joins them.
#
#   harness        native  = scored by a script in this repo
#                  adapter = scored by a third-party harness we wrap and version-pin
#   implementation in_repo = the entry script is here
#                  port_pending = the leg exists on the reference box, not yet here
#   cap_var        dotted path into standard.toml, or `caps.default`
#   data           items file for the leg, relative to the repo root (empty when the leg
#                  brings its own, e.g. an adapter that reads a third-party harness's data)
#   ctx_need       minimum served window for this leg to mean what it says
#   thinking       primary_on | primary_off | required_on | required_off | n/a
#   resume         done_marker | partial_jsonl | none

[[leg]]
id = "selftest"
name = "Endpoint and harness selftest"
measures = "that the endpoint answers and that the harnesses import, before any real leg burns budget"
scoring = "exit code; runs two items and refuses the battery on failure"
harness = "native"
implementation = "in_repo"
entry = "scripts/bench_selftest.py"
gate = true
cap_var = "caps.default"
ctx_need = 8192
thinking = "required_on"
thinking_effect = "a selftest that passes with thinking off can still fail on a reasoning leg"
prereqs = []
resume = "none"
comparability_keys = ["cap", "ctx"]
known_failures = ["a soft selftest hides a broken venv until 6 hours into the run"]

[[leg]]
id = "math500"
name = "MATH-500"
measures = "symbolic math reasoning, boxed final answers"
scoring = "sympy equivalence against the reference answer"
harness = "native"
implementation = "in_repo"
entry = "scripts/bench_math500.py"
data = "data/math500.json"
cap_var = "caps.default"
ctx_need = 8192
thinking = "primary_on"
thinking_effect = "the 3080 box moved 83.2% -> 91.0% when thinking was enabled"
prereqs = []
resume = "done_marker"
comparability_keys = ["cap", "ctx", "thinking", "seed", "items_sha"]
known_failures = [
  "a cap-hit item scored by scraping a letter out of truncated reasoning",
  "a thinking-off reasoner measures the cap, not the model",
]

