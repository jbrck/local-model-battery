[[leg]]
id = "hermesagent20"
name = "HermesAgent-20"
measures = "end-to-end agentic work against 20 real task scenarios"
scoring = "artifact checks inside a Docker sandbox running a pinned agent runtime"
harness = "adapter"
implementation = "in_repo"
entry = "scripts/adapters/hermesagent20.py"
cap_var = "caps.default"
ctx_need = 8192
thinking = "primary_on"
thinking_effect = "the run is budget-bound, so thinking costs wall time more than it costs score"
prereqs = ["docker_sandbox", "benchlocal_cli"]
resume = "partial_jsonl"
comparability_keys = ["cap", "thinking", "case_timeout", "sandbox_image", "harness_version"]
known_failures = [
  "top-level thinking_enabled in the result JSON is a CLI echo and lies",
  "the 600s per-case timeout is an invisible token cap: at 12 tok/s it lands near 7200 tokens",
  "without --enable-sandboxed-packs the pack is a stub that scores nothing",
]

[[leg]]
id = "lcb"
name = "LiveCodeBench (release_v6 lite)"
measures = "competitive programming against official test suites"
scoring = "lcb_runner codegen metrics, generated code executed"
harness = "adapter"
implementation = "in_repo"
entry = "scripts/adapters/lcb.py"
cap_var = "caps.lcb"
ctx_need = 114688
thinking = "primary_on"
thinking_effect = "removing the reasoning budget moved 66% -> 76% and added about 8 hours"
prereqs = ["lcb_source", "lcb_data"]
resume = "done_marker"
# The prompt helpers come from the checkout, so this leg runs under an interpreter that
# carries lcb_runner's dependencies. The repo's own venv has no datasets.
interpreter = "/mnt/data/benchmark-venv/bin/python3"
comparability_keys = ["cap", "ctx", "thinking", "items_sha", "slots"]
known_failures = [
  "16 of 100 problems never emitted a code block and consumed 7.4 of 14.1 hours",
  "budget for the worst case, not the average",
]

