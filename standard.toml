# standard.toml — the frozen battery standard.
#
# Every value here is a measurement variable: two runs are comparable only when both
# used the same standard version. Change a value, bump `standard_version`, and record it
# in CHANGELOG.md. Per-model differences belong in profiles/, never here.
#
# Floors and headroom are runaway guards, not measurements. Caps never shrink to fit a
# slow model; budgets grow instead.

standard_version = "v2"
incomparable_with = ["v0-reference", "v1"]

[caps]
# Completion-token ceiling per leg. Nothing uncapped.
default = 8192
lcb = 114688          # window minus 16384 prompt headroom
writing = 16384       # generation phase only
# Room the prompt needs, so the largest leg cap is serve.ctx minus this.
prompt_headroom = 16384

[caps.by_leg]
# Per-leg override of caps.default. Empty means "use default".

[serve]
ctx = 131072          # the largest leg cap sets this floor
slots = 4             # -np 4: capacity, not parallelism. The battery asks one request at a time,
                      # and unified KV means that one request still sees the whole window.
kv_unified = true     # explicit -np without unified KV gives each slot ctx/slots
flash_attn = true
kv_k = "q8_0"
kv_v = "q8_0"

[sampling]
temperature = 0.0
seed = 42

[judge]
# The scoring model for the writing leg. Part of the comparability key: two runs only
# compare when the same judge scored both. The endpoint is the operator's (empty means
# "the endpoint the run itself uses"), because the judge lives wherever their proxy is.
# The judge must never be a model under test.
model = "nous-glm-5-3-flash"
endpoint = ""

[limits]
math500 = 500
humaneval_plus = 164
gpqa_diamond = 198
instr_v2 = 20
refusal = 70
reasoning = 8
ifeval = 541
ifbench = 300
toolbench = 69
mmlu = 500
mmlu_even_per_subject = false
lcb = 100
lcb_workers = 4       # LCB's sandboxed code evaluation. It never touches the model.
hermesagent20 = 20
writing = 138

[budget]
headroom = 1.25       # budget = max(floor, headroom * items * cap / pilot_tps)
stall_min = 10        # flat token counter with requests in flight, minutes

[budget.floors]
# Seconds. Sized for a ~27 tok/s reference model. Floors, never measurements.
selftest = 300
math500 = 14400
humaneval_plus = 14400
gpqa_diamond = 10800
instr_v2 = 900
refusal = 5400
reasoning = 900
ifeval = 28800
ifbench = 7200
toolbench = 10800
mmlu = 28800
hermesagent20 = 14400
lcb = 28800
writing = 0

[budget.items]
# Items per leg, for the budget formula.
selftest = 2
math500 = 500
humaneval_plus = 164
gpqa_diamond = 198
instr_v2 = 20
refusal = 70
reasoning = 8
ifeval = 541
ifbench = 300
toolbench = 69
mmlu = 500
hermesagent20 = 20
lcb = 100
writing = 138

[timeouts]
hermesagent20_case_floor = 600   # a hidden per-case token cap on slow models
lcb_request_floor = 1800

[data]
# Bundled datasets. `sha256_16` is the first 16 hex digits of SHA-256: enough to prove
# two hosts ran the same file.

[[data.bundled]]
file = "data/math500.json"
